<style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Organic Breathing Animation */
        @keyframes breathe-outer {
            0%, 100% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.1; }
        }
        @keyframes breathe-middle {
            0%, 100% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        @keyframes breathe-inner {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 20px rgba(0, 110, 39, 0.1); }
            50% { transform: scale(1.05); box-shadow: 0 8px 32px rgba(0, 110, 39, 0.2); }
        }

        .animate-breathe-outer {
            animation: breathe-outer 14s infinite ease-in-out;
        }
        .animate-breathe-middle {
            animation: breathe-middle 14s infinite ease-in-out;
        }
        .animate-breathe-inner {
            animation: breathe-inner 14s infinite ease-in-out;
        }
    </style>
<style>
    body {

<body class="bg-surface text-on-surface antialiased font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-container">

<div class="w-72 h-72 rounded-full bg-surface-muted animate-breathe-outer absolute"></div>
<div class="w-56 h-56 rounded-full bg-secondary-fixed-dim animate-breathe-middle absolute"></div>
</div>
<!-- Core Circle -->
<div class="relative w-40 h-40 rounded-full bg-secondary-container flex items-center justify-center animate-breathe-inner z-10 border border-secondary-fixed/50">
<span class="font-display-hero text-display-hero text-on-surface text-center">
                    Nefes al
                </span>
</div>
</div>
<!-- Bottom Controls -->
<footer class="w-full flex flex-col items-center space-y-stack-lg mb-12 z-10">
<!-- Instructions -->
<div class="text-center px-4 max-w-xs">
<p class="font-body-md text-body-md text-text-secondary">
                    4 saniye içeri · 4 saniye tut · 6 saniye dışarı
                </p>
</div>
<!-- Action -->
<button class="font-label-sm text-label-sm text-text-secondary hover:text-primary transition-colors duration-300 py-3 px-6 rounded-full active:scale-95">
                Bitir
            </button>
</footer>
</main>
