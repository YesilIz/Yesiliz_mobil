    body {

<body class="bg-surface font-body-md text-on-surface h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim flex justify-between items-center px-screen-margin py-stack-md max-w-md mx-auto z-10">
<div class="flex items-center gap-2">
<button class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-fixed-dim hover:bg-surface-container-highest transition-transform duration-200 hover:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="font-headline-h1-mobile text-headline-h1-mobile font-bold text-primary dark:text-primary-fixed-dim">
            Yeşilİz
        </div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<main class="flex-1 w-full max-w-md mx-auto px-screen-margin py-stack-lg flex flex-col justify-between items-center z-10">
<!-- Center Content -->
<div class="flex flex-col items-center w-full mt-8">
<!-- Progress Ring -->
<div class="relative w-48 h-48 mb-stack-lg flex items-center justify-center">
<!-- Outer Ring Base -->
<svg class="w-full h-full transform -rotate-90 absolute" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#c4dec9" stroke-linecap="round" stroke-width="8"></circle>
<!-- Progress Fill (Empty state but ready for animation) -->
<circle class="transition-all duration-1000 ease-out" cx="50" cy="50" fill="none" r="45" stroke="#00AE42" stroke-dasharray="282.7" stroke-dashoffset="282.7" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Inner Text -->
<div class="flex flex-col items-center justify-center bg-surface-white rounded-full w-36 h-36 shadow-[0_2px_12px_rgba(18,71,52,0.06)] z-10">
<span class="font-display-hero text-display-hero text-primary">285<span class="text-headline-h2 text-text-secondary ml-1">dk</span></span>
<span class="font-label-sm text-label-sm text-text-secondary mt-1">günlük hedefin</span>
</div>
</div>
<!-- Typography -->
<div class="text-center w-full mb-stack-lg">
<h1 class="font-headline-h1-mobile text-headline-h1-mobile text-on-surface mb-stack-md">Küçük adımlarla başlıyoruz.</h1>
<p class="font-body-md text-body-md text-text-secondary">Şu anki ortalaman 300 dakika. İlk hafta hedefin sadece 15 dakika daha az.</p>
</div>
<!-- Horizontal Timeline -->
<div class="w-full bg-surface-white rounded-[20px] p-card-padding shadow-[0_2px_12px_rgba(18,71,52,0.06)] mb-stack-lg">
<div class="flex justify-between items-end relative h-20">
<!-- Timeline Line -->
<div class="absolute bottom-[22px] left-4 right-4 h-[2px] bg-divider z-0"></div>
<!-- Active Progress Line -->
<div class="absolute bottom-[22px] left-4 w-1/4 h-[2px] bg-primary z-0"></div>
<!-- Week 1 -->
<div class="flex flex-col items-center z-10 relative">
<span class="font-caption text-caption text-primary mb-2">285</span>
<div class="w-3 h-3 rounded-full bg-primary mb-1 border-2 border-surface-white"></div>
<span class="font-label-sm text-label-sm text-text-secondary">Hafta 1</span>
</div>
<!-- Week 4 -->
<div class="flex flex-col items-center z-10 relative">
<span class="font-caption text-caption text-text-secondary mb-2">240</span>
<div class="w-3 h-3 rounded-full bg-surface-muted mb-1 border-2 border-surface-white"></div>
<span class="font-label-sm text-label-sm text-text-secondary">Hafta 4</span>
</div>
<!-- Week 8 -->
<div class="flex flex-col items-center z-10 relative">
<span class="font-caption text-caption text-text-secondary mb-2">180</span>
<div class="w-3 h-3 rounded-full bg-surface-muted mb-1 border-2 border-surface-white"></div>
<span class="font-label-sm text-label-sm text-text-secondary">Hafta 8</span>
</div>
<!-- Week 12 -->
<div class="flex flex-col items-center z-10 relative">
<span class="font-caption text-caption text-text-secondary mb-2">120</span>
<div class="w-3 h-3 rounded-full bg-surface-muted mb-1 border-2 border-surface-white"></div>
<span class="font-label-sm text-label-sm text-text-secondary">Hafta 12</span>
</div>
</div>
</div>
</div>
<!-- Bottom Action -->
<div class="w-full pb-stack-md">
<button class="w-full h-[56px] bg-primary-container text-on-primary rounded-xl font-headline-h2 text-headline-h2 flex items-center justify-center transition-all duration-200 hover:scale-[0.98] active:bg-risk-mid">
                Hadi başlayalım
            </button>
</div>
</main>
<script>
        // Simple animation to draw the progress ring slightly to show it's active
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const circle = document.querySelector('circle.transition-all');
                if(circle) {
                    // Small progress just to show life
                    circle.style.strokeDashoffset = '260'; 
                }
            }, 300);
        });
    </script>
