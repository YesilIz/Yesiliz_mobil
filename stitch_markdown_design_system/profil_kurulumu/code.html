<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col antialiased">
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-screen-margin pt-stack-lg pb-stack-lg max-w-md mx-auto w-full relative">
<!-- Header Section -->
<header class="mb-stack-lg text-center">
<h1 class="font-display-hero text-display-hero text-on-surface mb-stack-sm">Seni biraz tanıyalım</h1>
<p class="font-caption text-caption text-text-secondary">Bu bilgiler önerileri sana uygun hale getirmek için.</p>
</header>
<!-- Form Content -->
<div class="flex-1 flex flex-col gap-stack-lg">
<!-- Age Stepper -->
<div class="bg-surface-white rounded-[20px] p-card-padding shadow-[0_2px_12px_rgba(18,71,52,0.06)]">
<label class="block font-headline-h2 text-headline-h2 text-on-surface mb-stack-md text-center">Yaşın</label>
<div class="flex items-center justify-between bg-surface-container-low rounded-full p-2 border-[1.5px] border-divider">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-white text-primary-container shadow-sm active:scale-95 transition-transform" onclick="decrementAge()" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">remove</span>
</button>
<div class="font-display-hero text-display-hero text-primary w-24 text-center" id="ageDisplay">25</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-white text-primary-container shadow-sm active:scale-95 transition-transform" onclick="incrementAge()" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">add</span>
</button>
</div>
</div>
<!-- Gender Segmented Control -->
<div class="bg-surface-white rounded-[20px] p-card-padding shadow-[0_2px_12px_rgba(18,71,52,0.06)]">
<label class="block font-headline-h2 text-headline-h2 text-on-surface mb-stack-md text-center">Cinsiyetin</label>
<div class="flex flex-col gap-2">
<label class="relative flex items-center justify-center p-4 border-[1.5px] border-divider rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-surface-container has-[:checked]:text-primary group">
<input class="peer sr-only" name="gender" type="radio" value="kadin"/>
<span class="font-body-md text-body-md text-text-secondary group-has-[:checked]:text-primary group-has-[:checked]:font-semibold">Kadın</span>
</label>
<label class="relative flex items-center justify-center p-4 border-[1.5px] border-divider rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-surface-container has-[:checked]:text-primary group">
<input class="peer sr-only" name="gender" type="radio" value="erkek"/>
<span class="font-body-md text-body-md text-text-secondary group-has-[:checked]:text-primary group-has-[:checked]:font-semibold">Erkek</span>
</label>
<label class="relative flex items-center justify-center p-4 border-[1.5px] border-divider rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary-container has-[:checked]:bg-surface-container has-[:checked]:text-primary group">
<input checked="" class="peer sr-only" name="gender" type="radio" value="belirtmek_istemiyorum"/>
<span class="font-body-md text-body-md text-text-secondary group-has-[:checked]:text-primary group-has-[:checked]:font-semibold">Belirtmek istemiyorum</span>
</label>
</div>
</div>
</div>
<!-- Bottom Action -->
<div class="mt-auto pt-stack-lg">
<button class="w-full h-[56px] bg-primary-container text-on-primary rounded-[16px] font-headline-h2 text-headline-h2 flex items-center justify-center active:scale-[0.98] transition-transform hover:bg-risk-mid">
                Devam
            </button>
</div>
</main>
<script>
        let currentAge = 25;
        const ageDisplay = document.getElementById('ageDisplay');

        function updateAgeDisplay() {
            ageDisplay.textContent = currentAge;
        }

        function incrementAge() {
            if (currentAge < 100) {
                currentAge++;
                updateAgeDisplay();
            }
        }

        function decrementAge() {
            if (currentAge > 13) {
                currentAge--;
                updateAgeDisplay();
            }
        }
    </script>
</body></html>
