<style>
        .stroke-dasharray-gauge {
            stroke-dasharray: 283;
            stroke-dashoffset: 135; /* Represents ~52% of 283 */
            transition: stroke-dashoffset 1s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-screen-margin py-stack-md z-50">
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-surface-container-highest overflow-hidden flex-shrink-0 hover:scale-95 transition-transform duration-200">
<img alt="User Profile Photo" class="w-full h-full object-cover" data-alt="A softly lit profile portrait of a smiling young adult in a natural, bright, light-mode setting. The overall aesthetic is calm, organic, and optimistic, matching a wellbeing application. Greens and warm whites dominate the color palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB6GPMYbGzM-uyd6LMEwG6grnZAeHgRChKK0JtdVrDX8yznXSe_jah20rSupr8wLOPIRsLj4bHQ3z-XMDkk_7QxRyf7pf0_Lax2JX0GYvU4rPUziS69G2tYdZbBjCpi_CPIxeVfpBX6jBgKh1RTLaw2i5odQC5BAQ-sKVSZHlUPVhTP-AIZMX5xCPoCKPkDbkytJ7TN6ws-iGtFOIK26bKYVIDJfMcKnq1ARzKzIV4XgBarGJytZagt17luUgjkoo5HErOLj8mnWEPt"/>
</button>
<h1 class="font-headline-h1-mobile text-headline-h1-mobile font-bold text-primary">Yeşilİz</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-container-low transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</header>
<main class="flex-1 flex flex-col px-screen-margin py-stack-md gap-stack-lg max-w-2xl mx-auto w-full pb-[100px]">
<!-- Gauge Section -->
<section class="flex flex-col items-center justify-center mt-4">
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Background track -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle class="stroke-surface-container-highest" cx="50" cy="50" fill="none" r="45" stroke-width="8"></circle>
<!-- Progress fill -->
<circle class="stroke-risk-mid stroke-dasharray-gauge" cx="50" cy="50" fill="none" r="45" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="flex flex-col items-center justify-center z-10 text-center">
<span class="font-display-hero text-display-hero text-on-surface">52</span>
</div>
</div>
<div class="mt-stack-md flex flex-col items-center text-center gap-1">
<div class="inline-flex items-center gap-2 px-4 py-1.5 bg-surface-container-low rounded-xl">
<div class="w-2 h-2 rounded-full bg-risk-mid"></div>
<span class="font-label-sm text-label-sm text-primary tracking-widest uppercase">ORTA RİSKLİ</span>
</div>
<p class="font-caption text-caption text-text-secondary mt-2 max-w-[240px]">
                    Bu bir teşhis değil, bir yön göstergesi
                </p>
</div>
</section>
<!-- Factors Section -->
<section class="bg-surface-white rounded-[20px] p-card-padding shadow-[0_2px_12px_rgba(18,71,52,0.06)] flex flex-col gap-stack-md">
<h2 class="font-headline-h2 text-headline-h2 text-on-surface">Bu seviyeyi en çok etkileyenler</h2>
<div class="flex flex-col gap-4">
<!-- Factor 1 -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Sosyal medya süresi</span>
</div>
<div class="h-[8px] w-full bg-surface-muted rounded-full overflow-hidden">
<div class="h-full bg-risk-mid rounded-full w-[85%]"></div>
</div>
</div>
<!-- Factor 2 -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Gece kullanımı</span>
</div>
<div class="h-[8px] w-full bg-surface-muted rounded-full overflow-hidden">
<div class="h-full bg-risk-mid rounded-full w-[50%] opacity-80"></div>
</div>
</div>
<!-- Factor 3 -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">Kesintisiz kullanım</span>
</div>
<div class="h-[8px] w-full bg-surface-muted rounded-full overflow-hidden">
<div class="h-full bg-risk-mid rounded-full w-[25%] opacity-60"></div>
</div>
</div>
</div>
</section>
<!-- Trend Card -->
<section class="bg-surface-white rounded-[20px] p-card-padding shadow-[0_2px_12px_rgba(18,71,52,0.06)] flex items-center justify-between gap-gutter active:scale-[0.98] transition-transform duration-200 cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined">trending_down</span>
</div>
<p class="font-body-md text-body-md font-medium text-on-surface">
                    Son 7 günde iyileşiyorsun.
                </p>
</div>
<!-- Sparkline Graphic -->
<div class="w-20 h-8">
<svg height="100%" preserveaspectratio="none" viewbox="0 0 100 30" width="100%">
<path class="text-primary-container" d="M0,15 Q20,5 40,20 T70,10 T100,25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
</section>
<!-- Action Button -->
<button class="w-full h-[56px] mt-4 bg-transparent border-[1.5px] border-primary text-primary font-label-sm text-label-sm font-semibold rounded-[16px] flex items-center justify-center gap-2 hover:bg-surface-container-low transition-colors duration-200 active:scale-95">
<span class="material-symbols-outlined text-[18px]">info</span>
            Nasıl hesaplanıyor?
        </button>
</main>
