<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center shrink-0 text-primary-container">
<span class="material-symbols-outlined fill text-[28px]" data-icon="energy_savings_leaf">energy_savings_leaf</span>
</div>
<div class="flex flex-col gap-1 pt-1">

</div>
</div>

                    Devam et

</div>
</div>
</div>
