<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Aktif Yürüyüş</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#9dd2b8",
                        "risk-mid": "#70ab70",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary": "#006e27",
                        "on-secondary-fixed-variant": "#1c4f3c",
                        "on-tertiary-container": "#00380e",
                        "risk-high": "#124734",
                        "tertiary-container": "#69a46a",
                        "primary-fixed": "#72fe86",
                        "surface-bright": "#f2fcf4",
                        "on-primary-fixed-variant": "#00531b",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#54e16d",
                        "surface-muted": "#c4dec9",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#ecf6ee",
                        "on-error": "#ffffff",
                        "inverse-surface": "#29322d",
                        "divider": "#E3EDE6",
                        "tertiary-fixed-dim": "#98d596",
                        "on-tertiary-fixed-variant": "#185121",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e1ebe3",
                        "primary-container": "#00ae42",
                        "outline-variant": "#bccbb8",
                        "on-primary-container": "#00380f",
                        "surface-container": "#e6f0e8",
                        "on-tertiary-fixed": "#002106",
                        "risk-low": "#00AE42",
                        "surface-tint": "#006e27",
                        "surface-container-highest": "#dbe5dd",
                        "background": "#f2fcf4",
                        "tertiary-fixed": "#b3f2b0",
                        "outline": "#6d7b6b",
                        "on-secondary-container": "#3a6c57",
                        "surface-white": "#FFFFFF",
                        "on-surface-variant": "#3d4a3c",
                        "surface": "#f2fcf4",
                        "secondary-container": "#b6ebd1",
                        "inverse-on-surface": "#e9f3eb",
                        "surface-dim": "#d2dcd5",
                        "secondary": "#366853",
                        "on-secondary-fixed": "#002115",
                        "on-surface": "#151d19",
                        "tertiary": "#326a36",
                        "secondary-fixed": "#b9eed3",
                        "on-background": "#151d19",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002107",
                        "text-secondary": "#5A6B60",
                        "surface-variant": "#dbe5dd",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#54e16d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "gutter": "16px",
                        "screen-margin": "20px",
                        "stack-sm": "4px",
                        "card-padding": "20px"
                    },
                    "fontFamily": {
                        "caption": ["Inter"],
                        "display-hero": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-h2": ["Inter"],
                        "headline-h1": ["Inter"],
                        "headline-h1-mobile": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "caption": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-hero": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-h1": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-h1-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-caption antialiased min-h-screen flex flex-col relative overflow-hidden h-full">
<!-- Soft Gradient Background -->
<div class="absolute inset-0 bg-gradient-to-b from-surface to-surface-muted -z-10 w-full h-full"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-screen-margin py-stack-lg relative h-full">
<!-- Timer Ring Container -->
<div class="relative flex items-center justify-center mb-stack-lg w-64 h-64">
<!-- Background Ring -->
<svg class="absolute inset-0 w-full h-full" viewbox="0 0 100 100">
<circle class="text-surface-muted opacity-50" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="4"></circle>
<!-- Progress Ring (55% filled) -->
<circle class="text-primary-container progress-ring__circle" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="282.7" stroke-dashoffset="127.2" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<!-- Timer Display -->
<div class="flex flex-col items-center justify-center z-10">
<div class="font-display-hero text-display-hero text-primary">08:24</div>
<div class="font-body-md text-body-md text-text-secondary mt-stack-sm">Yürüyüş sürüyor</div>
</div>
</div>
<!-- Live Stats -->
<div class="flex space-x-stack-lg mb-stack-lg">
<div class="flex flex-col items-center bg-surface-white px-6 py-4 rounded-xl shadow-[0_2px_12px_rgba(18,71,52,0.06)]">
<span class="material-symbols-outlined text-primary-container mb-2" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<span class="font-headline-h2 text-headline-h2 text-on-surface">1.240</span>
<span class="font-label-sm text-label-sm text-text-secondary">adım</span>
</div>
<div class="flex flex-col items-center bg-surface-white px-6 py-4 rounded-xl shadow-[0_2px_12px_rgba(18,71,52,0.06)]">
<span class="material-symbols-outlined text-tertiary-container mb-2" style="font-variation-settings: 'FILL' 1;">energy_savings_leaf</span>
<span class="font-headline-h2 text-headline-h2 text-on-surface">24</span>
<span class="font-label-sm text-label-sm text-text-secondary">puan</span>
</div>
</div>
<!-- Action Buttons -->
<div class="mt-auto w-full flex flex-col space-y-stack-md pb-stack-lg">
<button class="w-full h-[56px] rounded-[16px] bg-transparent border-[1.5px] border-primary-container text-primary-container font-headline-h2 text-headline-h2 flex items-center justify-center active:scale-[0.98] transition-transform">
<span class="material-symbols-outlined mr-2">pause</span>
                Duraklat
            </button>
<button class="w-full h-[56px] rounded-[16px] bg-transparent text-text-secondary font-body-md text-body-md flex items-center justify-center active:scale-[0.98] transition-transform">
                Bitir
            </button>
</div>
</main>
</body></html>
