<div class="h-20 bg-surface-container rounded-xl mb-4"></div>
<div class="h-40 bg-surface-container rounded-xl mb-4"></div>

<div class="h-32 bg-surface-container rounded-xl"></div>

</div>
</div>
</div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 left-0 w-full z-20 flex flex-col items-center justify-end h-full pointer-events-none">
<!-- The Bottom Sheet -->
<div class="bg-surface-white w-full rounded-t-[28px] pointer-events-auto transform transition-transform duration-300 translate-y-0 shadow-[0_-8px_24px_rgba(18,71,52,0.12)] flex flex-col max-h-[795px]">
<!-- Drag Handle Area -->
<div class="w-full flex justify-center pt-4 pb-2 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Content Area -->
<div class="px-screen-margin pb-stack-lg pt-stack-sm flex flex-col overflow-y-auto">
<!-- Header / Icon -->
<div class="flex items-center justify-between mb-stack-md">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px]">directions_walk</span>
</div>
<!-- Points Badge -->
<div class="bg-surface-container px-3 py-1.5 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-risk-low text-[18px]">eco</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">45 puan</span>
</div>
</div>
<!-- Title & Body -->
<h2 class="font-headline-h1-mobile text-headline-h1-mobile text-on-surface mb-2">15 dakika yürüyüş</h2>
<p class="font-body-md text-body-md text-text-secondary mb-stack-lg leading-relaxed">

                </p>

<div class="flex flex-wrap gap-2 mb-stack-lg">
<div class="bg-surface px-3 py-1.5 rounded-[12px] border border-divider">
<span class="font-label-sm text-label-sm text-risk-high">15 dk</span>
</div>
<div class="bg-surface px-3 py-1.5 rounded-[12px] border border-divider flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-primary">check_circle</span>

</div>
<div class="bg-surface px-3 py-1.5 rounded-[12px] border border-divider">
<span class="font-label-sm text-label-sm text-risk-high">Bugün 1 kez</span>
</div>
</div>
