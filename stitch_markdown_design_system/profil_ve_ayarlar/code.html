<script>
    // Simple toggle interaction logic for demonstration
    document.querySelectorAll('button.w-12').forEach(btn => {
      btn.addEventListener('click', function() {
        const thumb = this.querySelector('div');
        if (this.classList.contains('bg-primary-container')) {
          // Switch Off
          this.classList.remove('bg-primary-container');
          this.classList.add('bg-surface-variant');
          thumb.classList.remove('translate-x-6', 'bg-surface-white');
          thumb.classList.add('bg-text-secondary');
        } else {
          // Switch On
          this.classList.remove('bg-surface-variant');
          this.classList.add('bg-primary-container');
          thumb.classList.remove('bg-text-secondary');
          thumb.classList.add('translate-x-6', 'bg-surface-white');
        }
      });
    });
  </script>
