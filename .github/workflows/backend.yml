# Backend — test, güvenlik kapısı, dağıtım, smoke.
#
# Sıra `gorev1.md §5` ile birebir: test → yapılandırma/güvenlik kontrolü →
# imaj → dağıtım → migration → /health → smoke. Herhangi bir adım düşerse
# sonraki adım koşmuyor (`needs:`), yani dağıtım DURUYOR.
#
# Migration ayrı bir adım değil: `baslat.sh` kap açılırken
# `alembic upgrade head` koşuyor ve düşerse uvicorn hiç başlamıyor —
# sağlık kontrolü de düşüyor, sürüm devreye alınmıyor.
#
# Gerekli depo ayarları (Settings › Secrets and variables › Actions):
#   secret  RAILWAY_TOKEN   — Railway proje jetonu
#   var     RAILWAY_SERVICE — Railway'deki servis adı (ör. "api")
#   var     CANLI_TABAN     — https://<alan-adi>, smoke testleri buna koşuyor

name: backend

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  # Dağıtımı elle tetiklemek için.
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Testler ve güvenlik kapısı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Dockerfile ile aynı sürüm — "bende çalışıyordu" farkı olmasın.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Birim testleri
        run: python -m pytest -q

      - name: Üretim güvenlik kapısı — varsayılan anahtarla başlamamalı
        # `dogrula()` istisna fırlatmazsa komut 0 döner ve `!` bunu hataya
        # çevirir. Yani kapı çalışmıyorsa CI kırmızıya döner.
        run: |
          ! ENVIRONMENT=production \
            DATABASE_URL=postgresql://k:p@sunucu:5432/d \
            python -c "from app.ayarlar import ayarlar; ayarlar().dogrula()"

      - name: Üretim güvenlik kapısı — SQLite ile başlamamalı
        run: |
          ! ENVIRONMENT=production \
            JWT_SECRET=$(python -c "import secrets;print(secrets.token_urlsafe(32))") \
            DATABASE_URL=sqlite+pysqlite:///./y.db \
            python -c "from app.ayarlar import ayarlar; ayarlar().dogrula()"

      - name: Secret depoya girmemiş
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "::error::backend/.env depoya girmiş — secret sızıntısı"
            exit 1
          fi
        working-directory: .

      - name: Docker imajı derleniyor
        run: docker build -t yesiliz-api:${{ github.sha }} .

  deploy:
    name: Railway'e dağıt
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Ortam koruması: Railway jetonu yalnızca bu ortamdan okunabiliyor.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @railway/cli

      - name: Dağıtım
        run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: /health bekleniyor
        # Kap açılırken önce migration koşuyor; ilk saniyelerde 502 normal.
        # 20 × 15 sn = 5 dakika sınır.
        run: |
          taban="${{ vars.CANLI_TABAN }}"
          for i in $(seq 1 20); do
            kod=$(curl -s -o /tmp/saglik.json -w "%{http_code}" "$taban/health" || true)
            if [ "$kod" = "200" ]; then
              echo "sağlık kontrolü geçti:"; cat /tmp/saglik.json; exit 0
            fi
            echo "deneme $i — durum: $kod"
            sleep 15
          done
          echo "::error::/health 5 dakikada 200 dönmedi. Son yanıt:"
          cat /tmp/saglik.json || true
          exit 1

  smoke:
    name: Canlı ortam smoke testleri
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx pytest

      - name: Smoke
        run: python -m pytest smoke -q
        env:
          YESILIZ_SMOKE_TABAN: ${{ vars.CANLI_TABAN }}
